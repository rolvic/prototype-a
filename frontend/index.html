<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype A — Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); padding: 50px; text-align: center; max-width: 500px; }
        h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .badge { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 5px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
        p { color: #666; margin: 20px 0; line-height: 1.6; }
        .btn { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 16px; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .footer { margin-top: 30px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Prototype A</h1>
        <span class="badge">FRONTEND</span>
        <p>Sistema de registro de personas.<br>Backend: FastAPI + PostgreSQL + Redis</p>
        <a href="/api/" class="btn">Ir al Backend API</a>
        <div class="footer">
            <p>Deployed by devops-agents platform</p>
            <p>Frontend served by nginx | Static files</p>
        </div>
    </div>
</body>
</html>
